known_issues:
  - "In a split layout with two agents' chats side by side, a drag started while one agent's chat is in focus can be dropped into the other agent's chat; the reference then names a path on the wrong machine (no file moves between agents). Use Add to chat, or focus the target chat before dragging (electricsheephq/hermes-cloud-file-manager#55)."
