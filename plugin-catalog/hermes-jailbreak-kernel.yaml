name: hermes-jailbreak-kernel
repo: https://github.com/Enchanted0911/hermes-jailbreak-kernel
sha: eca97e0659794a98602d3cbc679dd4d0907800b6
description: >-
  Jailbreak-kernel plugin for Hermes Agent (ported from dsh-infinite-gen-4): session-scoped
  modes (off/slim/on/full) with kernel profiles (core/research/creative/max), session-aware
  system-prompt sections, llm_request request-layer system rebuild, and opencode session
  rotation, removing model refusals. Ships a /jailbreak command, a progressive-disclosure ops
  skill, and a 276-check offline self-test. Disclosure — llm_request middleware that
  replaces/appends the system prompt with a refusal-removal ("jailbreak") kernel on every
  request and rotates the x-opencode-session header; writes a per-session diagnostic dump of
  the full system prompt (which can include memory/persona text) to its own plugin dir
  (dumps/). No network, no exec.
maintainer: Enchanted0911
tier: community
category: general
requires_hermes: ">=0.19"
docs_url: https://github.com/Enchanted0911/hermes-jailbreak-kernel#readme
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware:
    - llm_request
  requires_env: []
