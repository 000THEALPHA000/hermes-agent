subdir: plugins/memory/nexus
version: "0.22.21"
description: "Self-hosted long-term memory on Qdrant with automatic per-turn prefetch and write-back, plus recall/remember/forget/guardrail tools and a knowledge graph. Runs fully local with Ollama or sentence-transformers embeddings; cloud embedders (Voyage, OpenAI, Google, Jina) are opt-in via their own API keys, and query rewriting plus paid consolidation stations stay off until enabled. Note that an embedding key already present in the environment is auto-detected, so the README's egress section is the authoritative list of what can leave the machine. Hermes and any MCP-connected agent share one collection, so they read and write the same memories. Since v0.22.21 five access-level paths fail closed and the graph walk checks access at all. Since v0.22.20 conversation history is stored as private, and a failed layout probe is no longer cached (one Qdrant hiccup used to break writes silently). Since v0.22.18 the Claude Code plugin writes to memory again: its store path used POST where Qdrant wants PUT, so every capture failed silently. Since v0.22.17 the memory provider can embed from inside a running event loop, so remember and recall work when Hermes calls the provider rather than failing silently. Since v0.22.16 the raw Qdrant calls put the vector name inside the vector object instead of a top-level field, so search, writes and the dimension guard work on a named collection rather than failing silently. Since v0.22.15 the source-tier keywords match whole words only, so ordinary text containing agent or user is no longer ranked as trusted. Since v0.22.13 the embedding model is stored in the collection itself as a named Qdrant vector; an existing unnamed collection needs one `legacy_collections` entry, and `scripts/detect-legacy-collection.py` prints the exact value. Disclosure — an embedding key already in Hermes' environment (VOYAGE/OPENAI/GOOGLE/JINA_API_KEY) is auto-detected and sends turn text to that provider for embedding; session-end fact extraction sends conversation text to the model endpoint in Hermes config.yaml; reads ~/.hermes/.env and config.yaml; state and daily backups under ~/.nexus-memory; an opt-in NEXUS_UPDATE_CHECK=1 adds a GitHub release check and an upgrade nudge to the system prompt."
maintainer: Neboy72
tier: community
category: memory
requires_hermes: ">=0.19"
docs_url: https://github.com/Neboy72/nexus-memory/blob/7b781c4cab52b6c511f9897da8cf9f99f3f7377b/plugins/memory/nexus/README.md
