description: 'Inspect captured browser verification evidence locally when an agent task is interrupted
  by a CAPTCHA. Portable Agent Plugins v1 package (pinned stateless mcp.json + skill); needs Node.js
  22.19+/24.11+/26+ with npx on PATH. Disclosure — first start asks the user to approve the exact
  rea-captcha@0.2.4 npm package; captcha_analyze is local and read-only; session tools fail closed without a separately
  configured stateful server; no production CAPTCHA automation, telemetry, hosted solver, browser
  profile copying, or cookie/token transfer.'
